name = "signup-name-enrichment"
main = "src/index.js"
compatibility_date = "2026-11-01"

[observability]
enabled = true

[vars]
# Comma separated. "*.example.com" allows any https subdomain.
ALLOWED_ORIGINS = "https://www.gorgias.com,https://gorgias.com,https://gorgiasio.webflow.io"
APOLLO_TIMEOUT_MS = "2500"

# 20 lookups per minute per IP. The signup endpoints are a bot target, and each Apollo hit costs a credit.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1971"
simple = { limit = 20, period = 60 }

# Secret, set with: npx wrangler secret put APOLLO_API_KEY
